<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHTSTEIN – Handgemacht. 100% Naturprodukt.</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: #111;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            border-bottom: 1px solid #f0f0f0;
            position: sticky;
            top: 0;
            background-color: #fff;
            z-index: 1000;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
            padding: 0;
        }

        .menu-btn span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: #111;
        }

        .logo {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 5px;
            text-decoration: none;
            color: #111;
            cursor: pointer;
        }

        .cart-icon {
            font-size: 13px;
            text-decoration: none;
            color: #111;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* Burger-Menü Overlay */
        .nav-overlay {
            position: fixed;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background-color: #fff;
            z-index: 2000;
            transition: left 0.3s ease;
            overflow-y: auto;
        }

        .nav-overlay.open { left: 0; }
        .nav-header { display: flex; justify-content: flex-end; padding: 24px 32px; }
        .close-btn { background: none; border: none; font-size: 36px; cursor: pointer; color: #111; font-weight: 200; }
        
        .nav-links {
            list-style: none;
            padding: 40px 10%;
            margin: 0;
        }

        .nav-links li {
            margin-bottom: 28px;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 24px;
            color: #111;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-links a:hover {
            color: #777;
        }

        /* Startseiten Hero / Dynamischer Titel */
        .hero {
            text-align: center;
            padding: 60px 20px 20px 20px;
        }

        .hero h1 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .hero p {
            font-size: 13px;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
        }

        /* Banner-Bild auf der Hauptseite */
        .hero-banner {
            width: 100%;
            max-width: 1400px;
            height: 500px;
            margin: 30px auto 60px auto;
            padding: 0 32px;
            transition: all 0.3s ease;
        }

        .hero-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #f7f7f7;
        }

        /* Produktbereich (Standardmäßig ausgeblendet auf der Hauptseite) */
        .products-section {
            display: none;
            max-width: 1400px;
            margin: 0 auto 80px auto;
            padding: 0 32px;
        }

        .products-section.active {
            display: block;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px 32px;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .product-image {
            width: 100%;
            height: 380px;
            background-color: #f7f7f7;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.04);
        }

        .product-title {
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 1.5px;
            margin: 0 0 6px 0;
            text-transform: uppercase;
