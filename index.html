<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohrringe – ECHTSTEIN</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: #111;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            border-bottom: 1px solid #f0f0f0;
            position: sticky;
            top: 0;
            background-color: #fff;
            z-index: 1000;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
            padding: 0;
        }

        .menu-btn span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: #111;
        }

        .logo {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 5px;
            text-decoration: none;
            color: #111;
        }

        .cart-icon {
            font-size: 13px;
            text-decoration: none;
            color: #111;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Burger-Menü Overlay */
        .nav-overlay {
            position: fixed;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background-color: #fff;
            z-index: 2000;
            transition: left 0.3s ease;
            overflow-y: auto;
        }

        .nav-overlay.open { left: 0; }
        .nav-header { display: flex; justify-content: flex-end; padding: 24px 32px; }
        .close-btn { background: none; border: none; font-size: 36px; cursor: pointer; color: #111; font-weight: 200; }
        .nav-links { list-style: none; padding: 40px 10%; margin: 0; }
        .nav-links li { margin-bottom: 28px; }
        .nav-links a { text-decoration: none; font-size: 24px; color: #111; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; }

        /* Kategorie Header */
        .category-header {
            text-align: center;
            padding: 60px 20px 40px 20px;
        }

        .category-header h1 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0 0 10px 0;
        }

        .category-header p {
            font-size: 13px;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
        }

        /* Produkt-Raster (4 Produkte) */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 32px;
            padding: 0 32px 80px 32px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .product-grid {
                grid-template-columns: 1fr;
                gap: 24px;
                padding: 0 16px 60px 16px;
            }
        }

        .product-card {
            text-decoration: none;
            color: #111;
            display: flex;
            flex-direction: column;
        }

        .product-card img {
            width: 100%;
            height: 480px;
            object-fit: cover;
            background-color: #f7f7f7;
            transition: opacity 0.3s ease;
        }

        .product-card:hover img {
            opacity: 0.92;
        }

        .product-title {
            margin-top: 16px;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .product-price {
            margin-top: 6px;
            font-size: 13px;
            color: #666;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="openMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a href="index.html" class="logo">ECHTSTEIN</a>
        <a href="#" class="cart-icon">Tasche (0)</a>
    </header>

    <div id="navOverlay" class="nav-overlay">
        <div class="nav-header">
            <button class="close-btn" onclick="closeMenu()">&times;</button>
        </div>
        <ul class="nav-links">
            <li><a href="diy.html" onclick="closeMenu()">Do it yourself</a></li>
            <li><a href="ohrringe.html" onclick="closeMenu()">Ohrringe</a></li>
            <li><a href="halsketten.html" onclick="closeMenu()">Halsketten</a></li>
            <li><a href="armbaender.html" onclick="closeMenu()">Armbänder</a></li>
            <li><a href="ringe.html" onclick="closeMenu()">Ringe</a></li>
        </ul>
    </div>

    <section class="category-header">
        <h1>Ohrringe</h1>
        <p>Handgemacht aus 100 % natürlichen Edelsteinen</p>
    </section>

    <!-- Die 4 Ohrring-Modelle -->
    <div class="product-grid">
        <a href="#" class="product-card">
            <img src="ohrringe-1.jpg" alt="Ohrringe Modell 1">
            <span class="product-title">Ohrringe Modell I</span>
            <span class="product-price">49,00 €</span>
        </a>
        <a href="#" class="product-card">
            <img src="ohrringe-2.jpg" alt="Ohrringe Modell 2">
            <span class="product-title">Ohrringe Modell II</span>
            <span class="product-price">54,00 €</span>
        </a>
        <a href="#" class="product-card">
            <img src="ohrringe-3.jpg" alt="Ohrringe Modell 3">
            <span class="product-title">Ohrringe Modell III</span>
            <span class="product-price">59,00 €</span>
        </a>
        <a href="#" class="product-card">
            <img src="ohrringe-4.jpg" alt="Ohrringe Modell 4">
            <span class="product-title">Ohrringe Modell IV</span>
            <span class="product-price">69,00 €</span>
        </a>
    </div>

    <script>
        function openMenu() {
            document.getElementById("navOverlay").classList.add("open");
        }
        function closeMenu() {
            document.getElementById("navOverlay").classList.remove("open");
        }
    </script>

</body>
</html>
