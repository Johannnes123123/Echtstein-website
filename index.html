<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHTSTEIN – Handgemacht. 100% Naturprodukt.</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: #111;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            border-bottom: 1px solid #f0f0f0;
            position: sticky;
            top: 0;
            background-color: #fff;
            z-index: 1000;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
            padding: 0;
        }

        .menu-btn span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: #111;
        }

        .logo {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 5px;
            text-decoration: none;
            color: #111;
        }

        .cart-icon {
            font-size: 13px;
            text-decoration: none;
            color: #111;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Burger-Menü Overlay (Vollbild) */
        .nav-overlay {
            position: fixed;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background-color: #fff;
            z-index: 2000;
            transition: left 0.3s ease;
            overflow-y: auto;
        }

        .nav-overlay.open { left: 0; }
        .nav-header { display: flex; justify-content: flex-end; padding: 24px 32px; }
        .close-btn { background: none; border: none; font-size: 36px; cursor: pointer; color: #111; font-weight: 200; }
        
        .nav-links {
            list-style: none;
            padding: 40px 10%;
            margin: 0;
        }

        .nav-links li {
            margin-bottom: 28px;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 24px;
            color: #111;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-links a:hover {
            color: #777;
        }

        /* Startseiten-Inhalt */
        .hero {
            text-align: center;
            padding: 80px 20px 30px 20px;
        }

        .hero h1 {
            font-size: 30px;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 13px;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
        }

        /* Reines Banner-Bild (nicht anklickbar) */
        .hero-banner {
            width: 100%;
            max-width: 1400px;
            height: 500px;
            margin: 40px auto 80px auto;
            padding: 0 32px;
        }

        .hero-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #f7f7f7;
        }

        @media (max-width: 768px) {
            .hero-banner { padding: 0 16px; height: 300px; }
            .hero h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <button class="menu-btn" onclick="openMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a href="index.html" class="logo">ECHTSTEIN</a>
        <a href="#" class="cart-icon">Tasche (0)</a>
    </header>

    <!-- Burger-Menü -->
    <div id="navOverlay" class="nav-overlay">
        <div class="nav-header">
            <button class="close-btn" onclick="closeMenu()">&times;</button>
        </div>
        <ul class="nav-links">
            <li><a href="diy.html" onclick="closeMenu()">Do it yourself</a></li>
            <li><a href="ohrringe.html" onclick="closeMenu()">Ohrringe</a></li>
            <li><a href="halsketten.html" onclick="closeMenu()">Halsketten</a></li>
            <li><a href="armbaender.html" onclick="closeMenu()">Armbänder</a></li>
            <li><a href="ringe.html" onclick="closeMenu()">Ringe</a></li>
        </ul>
    </div>

    <!-- Text auf der Startseite -->
    <section class="hero">
        <h1>Handgemacht. 100 % Naturprodukt.</h1>
        <p>Zeitlose Eleganz aus echten Steinen</p>
    </section>
<div class="hero-banner">
    <img src="hero-banner.jpg" alt="Echtstein Banner">
</div>
    <!-- Nur Bildanzeige ohne Link -->
    <div class="hero-banner">
        <img src="hero.jpg" alt="">
    </div>

    <script>
        function openMenu() {
            document.getElementById("navOverlay").classList.add("open");
        }
        function closeMenu() {
            document.getElementById("navOverlay").classList.remove("open");
        }
    </script>

</body>
</html>
