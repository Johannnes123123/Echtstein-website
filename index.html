<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHTSTEIN – Handgemacht. 100% Naturprodukt.</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: #111;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            border-bottom: 1px solid #f0f0f0;
            position: sticky;
            top: 0;
            background-color: #fff;
            z-index: 1000;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
            padding: 0;
        }

        .menu-btn span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: #111;
        }

        .logo {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 5px;
            text-decoration: none;
            color: #111;
        }

        .cart-icon {
            font-size: 13px;
            text-decoration: none;
            color: #111;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Burger-Menü Overlay */
        .nav-overlay {
            position: fixed;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background-color: #fff;
            z-index: 2000;
            transition: left 0.3s ease;
            overflow-y: auto;
        }

        .nav-overlay.open {
            left: 0;
        }

        .nav-header {
            display: flex;
            justify-content: flex-end;
            padding: 24px 32px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 36px;
            cursor: pointer;
            color: #111;
            font-weight: 200;
        }

        .nav-links {
            list-style: none;
            padding: 40px 10%;
            margin: 0;
        }

        .nav-links li {
            margin-bottom: 28px;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 24px;
            color: #111;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-links a:hover {
            color: #777;
        }

        /* Hero Text & Banner */
        .hero {
            text-align: center;
            padding: 60px 20px 40px 20px;
        }

        .hero h1 {
            font-size: 30px;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 13px;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
        }

        .hero-image {
            width: 100%;
            max-width: 1400px;
            height: 400px;
            margin: 0 auto 60px auto;
            padding: 0 32px;
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #f7f7f7;
        }

        .section-title {
            text-align: center;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #444;
            margin-bottom: 40px;
        }

        /* 5 Kategorien Raster */
        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            padding: 0 32px 80px 32px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .hero-image { padding: 0 16px; height: 250px; }
            .category-grid {
                grid-template-columns: 1fr;
                gap: 24px;
                padding: 0 16px 60px 16px;
            }
        }

        .category-card {
            text-decoration: none;
            color: #111;
            display: flex;
            flex-direction: column;
        }

        .category-card img {
            width: 100%;
            height: 480px;
            object-fit: cover;
            background-color: #f7f7f7;
            transition: opacity 0.3s ease;
        }

        .category-card:hover img {
            opacity: 0.92;
        }

        .category-card span {
            margin-top: 18px;
            font-size: 14px;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <button class="menu-btn" onclick="openMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <a href="index.html" class="logo">ECHTSTEIN</a>
        <a href="#" class="cart-icon">Tasche (0)</a>
    </header>

    <!-- Burger-Menü (Öffnet sich sauber im Vollbild) -->
    <div id="navOverlay" class="nav-overlay">
        <div class="nav-header">
            <button class="close-btn" onclick="closeMenu()">&times;</button>
        </div>
        <ul class="nav-links">
            <li><a href="diy.html" onclick="closeMenu()">Do it yourself</a></li>
            <li><a href="ohrringe.html" onclick="closeMenu()">Ohrringe</a></li>
            <li><a href="halsketten.html" onclick="closeMenu()">Halsketten</a></li>
            <li><a href="armbaender.html" onclick="closeMenu()">Armbänder</a></li>
            <li><a href="ringe.html" onclick="closeMenu()">Ringe</a></li>
        </ul>
    </div>

    <!-- Hauptbereich -->
    <section class="hero">
        <h1>Handgemacht. 100 % Naturprodukt.</h1>
        <p>Zeitlose Eleganz aus echten Steinen</p>
    </section>

    <!-- Hintergrundfoto -->
    <div class="hero-image">
        <img src="hero.jpg" alt="Echtstein Banner">
    </div>

    <div class="section-title">Kollektionen entdecken</div>

    <!-- Die 5 Kategorien als saubere Links -->
    <div class="category-grid">
        <a href="diy.html" class="category-card">
            <img src="diy.jpg" alt="Do it yourself">
            <span>Do it yourself</span>
        </a>
        <a href="ohrringe.html" class="category-card">
            <img src="ohrringe.jpg" alt="Ohrringe">
            <span>Ohrringe</span>
        </a>
        <a href="halsketten.html" class="category-card">
            <img src="halskette.jpg" alt="Halsketten">
            <span>Halsketten</span>
        </a>
        <a href="armband.html" class="category-card">
            <img src="armband.jpg" alt="Armbänder">
            <span>Armbänder</span>
        </a>
        <a href="ringe.html" class="category-card">
            <img src="ring.jpg" alt="Ringe">
            <span>Ringe</span>
        </a>
    </div>

    <script>
        function openMenu() {
            document.getElementById("navOverlay").classList.add("open");
        }

        function closeMenu() {
            document.getElementById("navOverlay").classList.remove("open");
        }
    </script>

</body>
</html>
