<!DOCTYPE html>
<html lang="de">
<head>

    <style>
        /* Modernes, minimalistisches CSS */
        body {

        header {
            background-color: #fff;

            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px; /* Etwas Abstand zwischen den Buchstaben für Eleganz */
        }

        header nav ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        header nav ul li {
            display: inline;
            margin-left: 20px;
        }

        header nav ul li a {
            text-decoration: none;
            color: #555;
            font-weight: 400;
        }

        /* Großer Bannerbereich (Hero Section) */
        .hero {
            background-image: url('images/main-banner.jpg'); /* HIER DEIN HAUPTBILD */
            background-size: cover;

            color: #fff;
            padding: 100px 40px;
            text-align: center;
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .hero .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #333; /* Dunkler Button */
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }

        /* Produktübersicht auf der Startseite */
        .products {
            padding: 60px 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* Rasterlayout */
            gap: 30px;
        }

        .product-card {
            background-color: #fff;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 5px;
            text-align: center;
        }

        .product-card img {
            max-width: 100%;
            height: auto;
            margin-bottom: 15px;
        }

        .product-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .product-card p {
            color: #777;
            font-size: 14px;
        }

        /* Fußbereich */
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

    </header>
