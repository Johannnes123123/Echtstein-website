<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHTSTEIN – Handgemacht. 100% Naturprodukt.</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: #111;
            text-align: center;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            border-bottom: 1px solid #f0f0f0;
        }
        .logo {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 5px;
            text-decoration: none;
            color: #111;
        }
        .hero {
            padding: 60px 20px;
        }
        .hero h1 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        .hero p {
            color: #666;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 13px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px 32px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #f7f7f7;
            padding: 40px 20px;
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <span>☰ Menü</span>
        <a href="index.html" class="logo">ECHTSTEIN</a>
        <span>Tasche</span>
    </header>

    <div class="hero">
        <h1>Handgemacht. 100 % Naturprodukt.</h1>
        <p>Zeitlose Eleganz aus echten Steinen</p>
    </div>

    <div class="grid">
        <div class="card">Do it yourself</div>
        <div class="card">Ohrringe</div>
        <div class="card">Halsketten</div>
        <div class="card">Armbänder</div>
        <div class="card" style="grid-column: span 2;">Ringe</div>
    </div>

</body>
</html>
