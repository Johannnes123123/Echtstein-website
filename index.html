<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHTSTEIN - Handgemachter Schmuck</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #fff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .hero {
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 80px 20px;
        }
        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .hero p {
            font-size: 16px;
            color: #aaa;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }
        .card {
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        .card-content {
            padding: 20px;
            text-align: center;
        }
        .card-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .card-price {
            color: #666;
            font-size: 14px;
        }
        footer {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 13px;
            border-top: 1px solid #eaeaea;
            margin-top: 60px;
            background: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ECHTSTEIN</div>
        <div>Kollektion 2026</div>
    </header>

    <section class="hero">
        <h1>Zeitlose Ohrringe</h1>
        <p>Handgefertigt mit Liebe zum Detail.</p>
    </section>

    <div class="container">
        <div class="grid">
            <div class="card">
                <img src="ohrring-1.jpg" alt="Ohrring Modell 1">
                <div class="card-content">
                    <div class="card-title">Modell 1</div>
                    <div class="card-price">Auf Anfrage</div>
                </div>
            </div>
            <div class="card">
                <img src="ohrring-2.jpg" alt="Ohrring Modell 2">
                <div class="card-content">
                    <div class="card-title">Modell 2</div>
                    <div class="card-price">Auf Anfrage</div>
                </div>
            </div>
            <div class="card">
                <img src="ohrring-3.jpg" alt="Ohrring Modell 3">
                <div class="card-content">
                    <div class="card-title">Modell 3</div>
                    <div class="card-price">Auf Anfrage</div>
                </div>
            </div>
            <div class="card">
                <img src="ohrring-4.jpg" alt="Ohrring Modell 4">
                <div class="card-content">
                    <div class="card-title">Modell 4</div>
                    <div class="card-price">Auf Anfrage</div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 ECHTSTEIN. Alle Rechte vorbehalten.
    </footer>

</body>
</html>
